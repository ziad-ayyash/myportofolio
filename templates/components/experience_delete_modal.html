<div id="delete-experience-modal" class="project-delete-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="delete-experience">
    <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-experience-modal"
        popovertargetaction="hide" aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close" popovertarget="delete-experience-modal"
            popovertargetaction="hide" aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-experience">Hapus Pengalaman?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="experience-delete-title"></strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary" popovertarget="delete-experience-modal"
                popovertargetaction="hide">Batal</button>
            <button type="submit" class="button button-danger" id="delete-confirmation-button">
                Ya, Hapus
            </button>
        </div>
    </div>
</div>
