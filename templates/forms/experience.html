{% extends "base.html" %}
{% block meta %}
<title>{{ mode }} Experience - {{ name }}</title>
{% endblock meta %}
{% block content %}
<main>
    <section class="page-section">
        <div class="container">
            <h1>{{ header }}</h1>
            <form method="post" action="{% if experience %}{% url action experience.id %}{% else %}{% url action %}{% endif %}" class="form-container">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="button">{{ submission_label }}</button>
                <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
